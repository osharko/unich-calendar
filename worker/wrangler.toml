# Deploy del Worker unich-proxy (proxy CORS + push cron).
# Richiede: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (nel .env in root).
#
#   npx wrangler deploy          # codice + bindings + cron (i secret restano)
#   npx wrangler secret put CRON_SECRET   # opzionale, per /tick manuale

name = "unich-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[[kv_namespaces]]
binding = "PUSH"
id = "754c8207197d4fd99ab0f7e342f9e555"

[triggers]
crons = ["*/15 * * * *"]

[vars]
VAPID_PUBLIC = "BIGT-2PCL-yPuN9PQ-IgxxTjqAMrcem8iRMVKmS_aPS24PzU0XczbiYyAhn69W66eVAGEMoJT9yC4vfheSzH5sc"
VAPID_SUBJECT = "mailto:luigi.minopoli@studenti.unich.it"
# VAPID_PRIVATE è un SECRET (non va qui). CRON_SECRET pure.
