<!doctype html>
<html lang="it" data-theme="latte">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario Lezioni · Ud'A</title>
<meta name="description" content="Calendario delle lezioni dell'Università G. d'Annunzio — Chieti–Pescara.">
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-h-dvh bg-base text-text">

<div x-data="unichApp()" x-init="init()" x-cloak class="flex min-h-dvh flex-col">

  <!-- ============================= HEADER ============================= -->
  <header class="sticky top-0 z-30 border-b border-surface0 bg-mantle/95 backdrop-blur">
    <div class="mx-auto flex w-full max-w-5xl items-center gap-2 px-3 py-2.5 sm:px-4 sm:py-3">
      <h1 class="flex items-center gap-2 text-base font-semibold sm:text-lg">
        <span class="text-mauve">◒</span>
        <span class="hidden sm:inline">Calendario Lezioni · Ud'A</span>
        <span class="sm:hidden">Lezioni Ud'A</span>
      </h1>

      <div class="ml-auto flex items-center gap-1">
        <template x-if="selezioni.length && !mostraMaterie">
          <button @click="mostraMaterie = true" title="Scegli le materie da vedere"
                  class="rounded-md border border-surface1 px-2.5 py-1.5 text-xs text-subtext1 hover:bg-surface0">
            Materie
          </button>
        </template>
        <button @click="esportaIcs()" x-show="selezioni.length" title="Esporta .ics"
                class="rounded-md border border-surface1 px-2.5 py-1.5 text-xs text-subtext1 hover:bg-surface0">.ics</button>
        <button @click="applicaTema(tema === 'latte' ? 'mocha' : tema === 'mocha' ? 'auto' : 'latte')"
                :title="'Tema: ' + tema"
                class="rounded-md border border-surface1 px-2.5 py-1.5 text-xs text-subtext1 hover:bg-surface0"
                x-text="tema === 'latte' ? '☀' : tema === 'mocha' ? '☾' : '◐'"></button>
        <button @click="aggiornaLezioni()" x-show="selezioni.length" title="Aggiorna le lezioni"
                class="rounded-md border border-surface1 px-2.5 py-1.5 text-xs text-subtext1 hover:bg-surface0">⟳</button>
        <button @click="mostraMaterie = false; apriWizard()" title="Aggiungi corsi"
                class="rounded-md bg-mauve px-3 py-1.5 text-xs font-medium text-crust hover:opacity-90">
          Corsi <span x-show="selezioni.length" x-text="'(' + selezioni.length + ')'"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================ MESSAGGI ============================ -->
  <template x-if="errore">
    <div class="mx-auto w-full max-w-5xl px-3 pt-3 sm:px-4">
      <div class="rounded-lg border border-red/40 bg-red/10 px-3 py-2 text-sm text-red" x-text="errore"></div>
    </div>
  </template>
  <template x-if="messaggio">
    <div class="mx-auto w-full max-w-5xl px-3 pt-3 sm:px-4">
      <div class="rounded-lg border border-green/40 bg-green/10 px-3 py-2 text-sm text-green" x-text="messaggio"></div>
    </div>
  </template>

  <!-- ============================== WIZARD ============================= -->
  <template x-if="!selezioni.length || wizardAperto">
    <section class="mx-auto w-full max-w-5xl flex-1 px-3 py-4 sm:px-4 sm:py-5">

      <!-- Intestazione + stato indice -->
      <div class="mb-4 flex flex-wrap items-center gap-2">
        <h2 class="text-base font-semibold">Scegli i tuoi corsi</h2>
        <span class="text-xs text-subtext0" x-show="indice"
              x-text="indice ? `${stats.corsi} corsi · agg. ${formattaData(indice.generatoIl)}` : ''"></span>
        <button @click="aggiornaIndice()" :disabled="scraping"
                class="ml-auto rounded-md border border-surface1 px-3 py-1.5 text-xs hover:bg-surface0 disabled:opacity-50">
          <span x-show="!scraping">⟳ Aggiorna elenco</span>
          <span x-show="scraping" x-text="scraping?.messaggio || 'Scaricamento…'"></span>
        </button>
      </div>

      <!-- Senza indice -->
      <template x-if="!indice && !scraping">
        <div class="rounded-xl border border-surface0 bg-mantle p-5 text-sm text-subtext0">
          Al primo accesso serve scaricare l'elenco dei corsi dal sito dell'ateneo
          (una sola richiesta). Premi <strong class="text-text">Aggiorna elenco</strong>.
        </div>
      </template>

      <template x-if="indice">
        <div class="overflow-hidden rounded-xl border border-surface0 bg-mantle">

          <!-- Breadcrumb -->
          <nav class="flex items-center gap-1 border-b border-surface0 px-3 py-2 text-xs">
            <button @click="indietro()" x-show="schermata !== 'polo'"
                    class="mr-1 rounded-md px-2 py-1 text-subtext1 hover:bg-surface0">‹ Indietro</button>
            <template x-for="(b, i) in [
              {n:'Polo', s:'polo', v:poloScelto},
              {n:'Dipartimento', s:'struttura', v:strutturaScelta},
              {n:'Corso', s:'corso', v:corsoScelto?.nome},
              {n:'Anno', s:'anni', v:null},
            ]" :key="b.s">
              <button @click="vaiA(b.s)"
                      class="truncate rounded px-1.5 py-1 hover:bg-surface0"
                      :class="schermata === b.s ? 'font-semibold text-mauve' : (b.v ? 'text-subtext1' : 'text-overlay0')"
                      x-text="b.v ? b.v : b.n"></button>
              <span x-show="i < 3" class="text-overlay0">›</span>
            </template>
          </nav>

          <!-- --- STEP 1: POLO --- -->
          <div x-show="schermata === 'polo'" class="p-3 sm:p-4">
            <ul class="grid gap-2 sm:grid-cols-2">
              <template x-for="p in poli" :key="p.nome">
                <li>
                  <button @click="scegliPolo(p.nome)"
                          class="flex w-full items-center justify-between rounded-lg border px-4 py-3 text-left text-sm transition"
                          :class="poloScelto === p.nome ? 'border-mauve bg-mauve/10' : 'border-surface0 hover:bg-surface0/60'">
                    <span x-text="p.nome"></span>
                    <span class="text-xs text-subtext0" x-text="p.strutture.length + ' dip.'"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>

          <!-- --- STEP 2: DIPARTIMENTO --- -->
          <div x-show="schermata === 'struttura'" class="p-3 sm:p-4">
            <ul class="grid gap-2 sm:grid-cols-2">
              <template x-for="s in strutture" :key="s.nome">
                <li>
                  <button @click="scegliStruttura(s.nome)"
                          class="flex w-full items-center justify-between gap-2 rounded-lg border px-4 py-3 text-left text-sm transition"
                          :class="strutturaScelta === s.nome ? 'border-mauve bg-mauve/10' : 'border-surface0 hover:bg-surface0/60'">
                    <span x-text="s.nome"></span>
                    <span class="shrink-0 text-xs text-subtext0" x-text="s.corsi.length"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>

          <!-- --- STEP 3: CORSO --- -->
          <div x-show="schermata === 'corso'" class="p-3 sm:p-4">
            <input type="search" x-model="ricercaCorso" placeholder="Filtra i corsi…"
                   class="mb-3 w-full rounded-md border border-surface1 bg-base px-3 py-2 text-sm">
            <ul class="grid gap-2 sm:grid-cols-2">
              <template x-for="c in corsiFiltrati" :key="c.url || c.nome">
                <li>
                  <button @click="scegliCorso(c)"
                          class="w-full rounded-lg border px-4 py-3 text-left text-sm transition"
                          :class="corsoScelto?.nome === c.nome ? 'border-mauve bg-mauve/10' : 'border-surface0 hover:bg-surface0/60'">
                    <span x-text="c.nome"></span>
                  </button>
                </li>
              </template>
            </ul>
            <p x-show="!corsiFiltrati.length" class="py-4 text-center text-sm text-subtext0">Nessun corso trovato.</p>
          </div>

          <!-- --- STEP 4: ANNO --- -->
          <div x-show="schermata === 'anni'" class="p-3 sm:p-4">
            <p class="mb-3 text-sm font-medium" x-text="corsoScelto?.nome"></p>
            <p x-show="anniInCaricamento" class="text-sm text-subtext0">Carico gli anni…</p>
            <p x-show="!anniInCaricamento && anniDelCorso && !anniDelCorso.length"
               class="text-sm text-subtext0">Nessun anno pubblicato per questo corso.</p>
            <div class="flex flex-wrap gap-2">
              <template x-for="cal in (anniDelCorso || [])" :key="cal.linkCalendarioId">
                <button @click="aggiungiCalendario(cal)"
                        :disabled="calendarioGiaScelto(cal.linkCalendarioId)"
                        class="rounded-lg border border-surface1 px-4 py-2.5 text-sm hover:bg-surface0 disabled:opacity-40">
                  <span x-text="cal.etichetta"></span>
                  <span x-show="calendarioGiaScelto(cal.linkCalendarioId)" class="ml-1 text-xs">✓</span>
                </button>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Corsi già scelti -->
      <template x-if="selezioni.length">
        <div class="mt-4 rounded-xl border border-surface0 bg-mantle p-4">
          <div class="mb-2 flex items-center justify-between">
            <h3 class="text-sm font-semibold">I tuoi calendari</h3>
            <button @click="apriCalendario()"
                    class="rounded-md bg-mauve px-3 py-1.5 text-xs font-medium text-crust hover:opacity-90">
              Vedi calendario
            </button>
          </div>
          <ul class="space-y-1.5">
            <template x-for="s in selezioni" :key="s.linkCalendarioId">
              <li class="flex items-center gap-2 text-sm">
                <input type="checkbox" :checked="s.attivo" @change="toggleSelezione(s.linkCalendarioId)"
                       class="accent-[var(--ctp-mauve)]">
                <span class="inline-block h-3 w-3 shrink-0 rounded-sm" :style="`background: var(--ctp-${palette[s.colore % palette.length]})`"></span>
                <span class="truncate" x-text="s.corso"></span>
                <span class="shrink-0 text-subtext0" x-text="'· ' + s.etichetta"></span>
                <button @click="rimuoviCalendario(s.linkCalendarioId)"
                        class="ml-auto shrink-0 text-xs text-red hover:underline">Rimuovi</button>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </section>
  </template>

  <!-- ============================ MATERIE ============================ -->
  <template x-if="mostraMaterie">
    <section class="mx-auto w-full max-w-5xl flex-1 px-3 py-4 sm:px-4 sm:py-5">
      <div class="mb-4 flex items-center gap-2">
        <button @click="mostraMaterie = false" class="rounded-md px-2 py-1 text-sm text-subtext1 hover:bg-surface0">‹ Indietro</button>
        <h2 class="text-base font-semibold">Materie da visualizzare</h2>
        <div class="ml-auto flex gap-2">
          <button @click="tutteMaterie(true)" class="rounded-md border border-surface1 px-2.5 py-1.5 text-xs hover:bg-surface0">Tutte</button>
          <button @click="tutteMaterie(false)" class="rounded-md border border-surface1 px-2.5 py-1.5 text-xs hover:bg-surface0">Nessuna</button>
        </div>
      </div>

      <p class="mb-3 text-xs text-subtext0">
        Deseleziona le materie che non ti interessano: spariranno dal calendario.
      </p>

      <template x-for="s in selezioni" :key="s.linkCalendarioId">
        <div class="mb-4 overflow-hidden rounded-xl border border-surface0 bg-mantle">
          <div class="flex items-center gap-2 border-b border-surface0 px-3 py-2">
            <span class="inline-block h-3 w-3 rounded-sm" :style="`background: var(--ctp-${palette[s.colore % palette.length]})`"></span>
            <span class="text-sm font-medium" x-text="s.corso"></span>
            <span class="text-xs text-subtext0" x-text="'· ' + s.etichetta"></span>
          </div>
          <ul class="divide-y divide-surface0/60">
            <template x-for="m in materie.filter(x => x.selId === s.linkCalendarioId)" :key="m.id">
              <li>
                <label class="flex cursor-pointer items-center gap-3 px-3 py-2.5 text-sm hover:bg-surface0/40">
                  <input type="checkbox" :checked="m.visibile" @change="toggleMateria(m)"
                         class="h-4 w-4 shrink-0 accent-[var(--ctp-mauve)]">
                  <span class="inline-block h-3.5 w-3.5 shrink-0 rounded-full ring-1 ring-inset ring-black/10"
                        :style="`background: var(--mat-${m.indiceColore % 50})`"></span>
                  <span class="min-w-0 flex-1">
                    <span class="block truncate" x-text="m.insegnamento"></span>
                    <span class="block truncate text-xs text-subtext0"
                          x-text="[m.annoCorso ? m.annoCorso + '° anno' : null, m.docenti?.join(', ')].filter(Boolean).join(' · ')"></span>
                  </span>
                  <span class="shrink-0 text-xs text-overlay0" x-text="m.n + ' lez.'"></span>
                </label>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </section>
  </template>

  <!-- ============================ CALENDARIO ============================ -->
  <main x-show="selezioni.length && !wizardAperto && !mostraMaterie"
        class="mx-auto w-full max-w-5xl flex-1 px-2 pb-10 sm:px-4">

    <!-- Toolbar -->
    <div class="flex flex-wrap items-center gap-2 py-3">
      <div class="flex items-center gap-1">
        <button @click="vai(-1)" aria-label="Periodo precedente"
                class="rounded-md border border-surface1 px-2.5 py-1.5 text-sm hover:bg-surface0">‹</button>
        <button @click="oggi()" class="rounded-md border border-surface1 px-3 py-1.5 text-sm hover:bg-surface0">Oggi</button>
        <button @click="vai(1)" aria-label="Periodo successivo"
                class="rounded-md border border-surface1 px-2.5 py-1.5 text-sm hover:bg-surface0">›</button>
      </div>

      <span class="text-sm font-medium capitalize" x-text="titoloPeriodo"></span>

      <div class="ml-auto flex items-center gap-2">
        <label class="hidden items-center gap-1 text-xs text-subtext0 md:flex">
          <input type="checkbox" x-model="nascondiAnnullati" @change="ricalcola()" class="accent-[var(--ctp-mauve)]">
          nascondi annullate
        </label>
        <select x-show="vista === 'settimana'" :value="giorniVisibili"
                @change="cambiaGiorniVisibili($event.target.value)" aria-label="Giorni visibili"
                class="rounded-md border border-surface1 bg-base px-2 py-1.5 text-xs">
          <option value="1">1 giorno</option>
          <option value="3">3 giorni</option>
          <option value="5">5 giorni</option>
          <option value="7">Settimana</option>
        </select>
        <select x-model="vista" @change="cambiaVista(vista)" aria-label="Vista"
                class="rounded-md border border-surface1 bg-base px-2 py-1.5 text-xs">
          <option value="settimana">Orizzontale</option>
          <option value="mese">Mese</option>
        </select>
      </div>
    </div>

    <!-- Niente lezioni -->
    <template x-if="!giorni.some(g => g.lezioni.length)">
      <div class="rounded-xl border border-dashed border-surface1 px-4 py-10 text-center text-sm text-subtext0">
        Nessuna lezione in questo periodo.
        <button @click="aggiornaLezioni()" class="ml-1 text-mauve hover:underline">Aggiorna</button>
      </div>
    </template>

    <!-- Timetable -->
    <template x-if="giorni.some(g => g.lezioni.length)">
      <div class="scrollarea overflow-x-auto rounded-xl border border-surface0 bg-mantle">
        <div class="timetable p-2" :style="`--giorni:${giorni.length}`" x-ref="griglia">
          <!-- Intestazione giorni -->
          <div class="timetable-grid">
            <div class="sticky left-0 z-10 bg-mantle"></div>
            <template x-for="g in giorni" :key="g.key">
              <div class="px-0.5 pb-2 text-center text-[11px]"
                   :class="g.oggi ? 'text-mauve' : 'text-subtext1'">
                <div x-text="g.nome"></div>
                <div class="text-sm" :class="g.oggi ? 'font-semibold text-mauve' : 'text-text'" x-text="g.numero"></div>
              </div>
            </template>
          </div>

          <!-- Corpo -->
          <div class="timetable-grid">
            <!-- Scala ore (fissa mentre si scorre) -->
            <div class="sticky left-0 z-10 bg-mantle" :style="`height:${(oraMax - oraMin) * altezzaOra}px`">
              <template x-for="h in ore" :key="h">
                <div class="absolute right-1.5 -translate-y-1/2 text-[10px] text-subtext0"
                     :style="`top:${(h - oraMin) * altezzaOra}px`" x-text="`${String(h).padStart(2,'0')}:00`"></div>
              </template>
            </div>

            <!-- Colonne giorni -->
            <template x-for="g in giorni" :key="g.key">
              <div class="relative border-l border-surface0" :style="`height:${(oraMax - oraMin) * altezzaOra}px`">
                <template x-for="h in ore" :key="h">
                  <div class="pointer-events-none absolute inset-x-0 border-t border-surface0/60"
                       :style="`top:${(h - oraMin) * altezzaOra}px`"></div>
                </template>

                <div class="pointer-events-none absolute inset-x-0 top-0 h-full bg-overlay0/10"
                     x-show="indisponibilita.some(x => x.giorno.key === g.key)"></div>

                <template x-for="l in g.lezioni" :key="l.id">
                  <button @click="apriDettaglio(l)"
                          class="lesson absolute overflow-hidden px-1 py-0.5 text-left text-[10px] leading-tight sm:px-1.5 sm:text-[11px]"
                          :style="`
                            top: ${l._top}%;
                            height: calc(${l._altezza}% - 2px);
                            left: calc(${l._col} * (100% / ${l._nCol}) + 1px);
                            width: calc(100% / ${l._nCol} - 3px);
                            color: var(--mat-${(coloreDiLezione(l) ?? 0) % 50});
                            background: color-mix(in srgb, currentColor 16%, transparent);
                          `">
                    <span class="block font-semibold" :style="l._altezza < 7 ? 'white-space:nowrap' : ''" x-text="l.insegnamento"></span>
                    <span class="block opacity-80" x-text="formattaOra(l.inizio)"></span>
                    <span class="block truncate opacity-70" x-show="l.aule.length && l._altezza > 8"
                          x-text="l.aule.map(a => a.codice || a.descrizione).join(', ')"></span>
                  </button>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- Legenda materie visibili, con il loro colore -->
    <div class="mt-3 flex flex-wrap gap-x-3 gap-y-1.5 text-xs">
      <template x-for="m in materie.filter(x => x.visibile)" :key="m.id">
        <span class="flex items-center gap-1.5">
          <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full" :style="`background: var(--mat-${m.indiceColore % 50})`"></span>
          <span class="truncate" x-text="m.insegnamento"></span>
        </span>
      </template>
    </div>
  </main>

  <!-- ============================ DETTAGLIO ============================ -->
  <template x-if="dettaglio">
    <div class="fixed inset-0 z-40 flex items-end justify-center bg-crust/60 p-0 sm:items-center sm:p-4"
         @click.self="chiudiDettaglio()">
      <div class="max-h-[85dvh] w-full max-w-md overflow-y-auto rounded-t-2xl border border-surface0 bg-base p-4 sm:rounded-2xl">
        <div class="mb-3 flex items-start gap-2">
          <span class="mt-1 inline-block h-3 w-3 shrink-0 rounded-full"
                :style="`background: var(--mat-${(coloreDiLezione(dettaglio) ?? 0) % 50})`"></span>
          <h3 class="text-base font-semibold" x-text="dettaglio.insegnamento"></h3>
          <button @click="chiudiDettaglio()" class="ml-auto text-subtext0 hover:text-text">✕</button>
        </div>
        <dl class="space-y-2 text-sm">
          <div class="flex gap-2"><dt class="w-20 shrink-0 text-subtext0">Quando</dt>
            <dd x-text="formattaData(dettaglio.inizio, { weekday:'long', day:'numeric', month:'long' }) + ', ' + formattaOra(dettaglio.inizio) + '–' + formattaOra(dettaglio.fine)"></dd></div>
          <div class="flex gap-2" x-show="dettaglio.docenti.length"><dt class="w-20 shrink-0 text-subtext0">Docenti</dt>
            <dd x-text="dettaglio.docenti.join(', ')"></dd></div>
          <div class="flex gap-2" x-show="dettaglio.aule.length"><dt class="w-20 shrink-0 text-subtext0">Aule</dt>
            <dd x-text="dettaglio.aule.map(a => [a.codice, a.edificio, a.comune].filter(Boolean).join(' · ')).join('; ')"></dd></div>
          <div class="flex gap-2" x-show="dettaglio.annoCorso"><dt class="w-20 shrink-0 text-subtext0">Anno</dt>
            <dd x-text="dettaglio.annoCorso + '°'"></dd></div>
          <div class="flex gap-2" x-show="dettaglio.codice"><dt class="w-20 shrink-0 text-subtext0">Codice</dt>
            <dd x-text="dettaglio.codice"></dd></div>
          <div class="flex gap-2" x-show="dettaglio.stato === 'A'"><dt class="w-20 shrink-0 text-subtext0">Stato</dt>
            <dd class="text-red">Lezione annullata</dd></div>
        </dl>
      </div>
    </div>
  </template>

  <!-- ============================= FOOTER ============================= -->
  <footer class="border-t border-surface0 py-4 text-center text-[11px] text-subtext0">
    Dati da <span class="text-subtext1">unich.it</span> e dall'API pubblica Cineca · progetto non ufficiale
  </footer>
</div>

<script type="module">
  import { unichApp } from './js/app.js';
  window.unichApp = unichApp;

  const s = document.createElement('script');
  s.src = './js/vendor/alpine.min.js';
  s.defer = true;
  document.head.appendChild(s);

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
